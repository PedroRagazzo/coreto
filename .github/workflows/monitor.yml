name: Monitor

# De 10 em 10 minutos, confere se o servidor do Coreto responde e avisa quando ele cai e quando volta (uma vez cada). Também
# avisa quando o disco da VPS passa de 80% (aviso) e de 90% (urgente), e quando volta ao normal: o servidor informa o uso do
# disco em /health.
# O aviso vem de fora do servidor, porque um servidor fora do ar não consegue avisar. Como avisa (ver README, "Alerta de
# servidor fora do ar"):
#   - sempre: esta execução fica vermelha quando o servidor cai, e o GitHub manda e-mail (e notificação no app do GitHub);
#   - se existir o segredo NTFY_TOPIC: notificação no celular pelo app ntfy;
#   - se existir o segredo DISCORD_WEBHOOK: mensagem num canal do Discord.
# O estado ("já avisei que caiu", "já avisei do disco") fica na execução anterior: ela conta como "fora do ar" se o passo
# "Registrar queda" rodou, e como "disco alto" se rodou "Registrar disco alto" (ou "Registrar disco critico").

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      teste:
        description: 'Só manda um aviso de teste (para conferir o ntfy e o Discord), sem mexer no estado'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  health:
    name: Servidor no ar?
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            deploy/monitor
            desktop/coreto.config.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Avisos
        id: notify
        run: |
          cat > "$RUNNER_TEMP/notify.sh" <<'SH'
          # notify <título sem acentos> <mensagem> <prioridade do ntfy> <ícone do ntfy>
          notify() {
            if [ -n "$NTFY_TOPIC" ]; then
              curl -fsS -m 20 -H "Title: $1" -H "Priority: $3" -H "Tags: $4" -d "$2" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || echo "ntfy falhou"
            fi
            if [ -n "$DISCORD_WEBHOOK" ]; then
              curl -fsS -m 20 -H 'content-type: application/json' \
                -d "$(node -e 'console.log(JSON.stringify({ content: `**${process.argv[1]}**\n${process.argv[2]}` }))' "$1" "$2")" \
                "$DISCORD_WEBHOOK" >/dev/null || echo "discord falhou"
            fi
          }
          SH
          echo "script=$RUNNER_TEMP/notify.sh" >> "$GITHUB_OUTPUT"

      - name: Aviso de teste
        if: ${{ inputs.teste }}
        run: |
          . "${{ steps.notify.outputs.script }}"
          if [ -z "$NTFY_TOPIC" ] && [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Nenhum segredo configurado (NTFY_TOPIC ou DISCORD_WEBHOOK): só o e-mail do GitHub avisa quando o servidor cair."
          fi
          notify "Coreto: teste do alerta" "Se voce recebeu isto, o alerta de servidor fora do ar esta funcionando." default "white_check_mark"

      - name: Conferir o servidor
        id: check
        if: ${{ !inputs.teste }}
        run: node deploy/monitor/check.ts "$(node -p "require('./desktop/coreto.config.json').url")"

      # O estado vem da execução anterior (concluída): ela estava "fora do ar" se rodou o passo "Registrar queda", e com o
      # disco alto (ou crítico) se rodou o passo "Registrar disco alto" (ou "Registrar disco critico").
      - name: Ver o estado anterior
        id: before
        if: ${{ !inputs.teste }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/monitor.yml/runs?status=completed&per_page=1&event=schedule" --jq '.workflow_runs[0].id // empty')
          was_down=false; was_disk_warn=false; was_disk_critical=false
          if [ -n "$run_id" ]; then
            steps=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" --jq '.jobs[0].steps')
            ran() { echo "$steps" | jq -r --arg name "$1" '[.[] | select(.name == $name) | .conclusion] | first // "skipped"'; }
            [ "$(ran 'Registrar queda')" != "skipped" ] && was_down=true
            [ "$(ran 'Registrar disco alto')" != "skipped" ] && was_disk_warn=true
            [ "$(ran 'Registrar disco critico')" != "skipped" ] && was_disk_critical=true
          fi
          echo "Execução anterior: ${run_id:-nenhuma}; fora do ar: $was_down; disco alto: $was_disk_warn; disco crítico: $was_disk_critical"
          {
            echo "was_down=$was_down"
            echo "was_disk_warn=$was_disk_warn"
            echo "was_disk_critical=$was_disk_critical"
          } >> "$GITHUB_OUTPUT"

      # Só roda (e portanto só conta como "fora do ar" na próxima vez) quando o servidor está fora do ar.
      - name: Registrar queda
        id: down
        if: ${{ !inputs.teste && steps.check.outputs.up == 'false' }}
        env:
          DETAIL: ${{ steps.check.outputs.detail }}
          WAS_DOWN: ${{ steps.before.outputs.was_down }}
        run: |
          . "${{ steps.notify.outputs.script }}"
          if [ "$WAS_DOWN" = "true" ]; then
            echo "Continua fora do ar ($DETAIL); o aviso já foi dado."
          else
            notify "Coreto fora do ar" "O servidor nao responde: $DETAIL. Confira o painel do Dokploy." urgent "rotating_light"
          fi

      - name: Voltou
        if: ${{ !inputs.teste && steps.check.outputs.up == 'true' && steps.before.outputs.was_down == 'true' }}
        run: |
          . "${{ steps.notify.outputs.script }}"
          notify "Coreto voltou" "O servidor voltou a responder." default "white_check_mark"

      # Disco: um aviso por faixa. De alto para crítico avisa de novo; de crítico para alto não (já foi dito), e quando volta
      # ao normal avisa uma vez. Sem número (servidor que ainda não informa o disco), nada acontece.
      - name: Registrar disco alto
        id: disk_warn
        if: ${{ !inputs.teste && steps.check.outputs.disk_level == 'warn' }}
        env:
          DETAIL: ${{ steps.check.outputs.disk_detail }}
          WAS_WARN: ${{ steps.before.outputs.was_disk_warn }}
          WAS_CRITICAL: ${{ steps.before.outputs.was_disk_critical }}
        run: |
          . "${{ steps.notify.outputs.script }}"
          if [ "$WAS_WARN" = "true" ] || [ "$WAS_CRITICAL" = "true" ]; then
            echo "Disco continua alto ($DETAIL); o aviso já foi dado."
          else
            notify "Coreto: disco enchendo" "O disco da VPS esta com $DETAIL. Apague backups ou anexos antigos, ou aumente o disco, antes que encha." high "floppy_disk"
            echo "alerted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Registrar disco critico
        id: disk_critical
        if: ${{ !inputs.teste && steps.check.outputs.disk_level == 'critical' }}
        env:
          DETAIL: ${{ steps.check.outputs.disk_detail }}
          WAS_CRITICAL: ${{ steps.before.outputs.was_disk_critical }}
        run: |
          . "${{ steps.notify.outputs.script }}"
          if [ "$WAS_CRITICAL" = "true" ]; then
            echo "Disco continua crítico ($DETAIL); o aviso já foi dado."
          else
            notify "Coreto: disco quase cheio" "O disco da VPS esta com $DETAIL. Se encher, o banco e os anexos param de gravar. Libere espaco agora." urgent "rotating_light"
            echo "alerted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Disco normalizou
        if: ${{ !inputs.teste && steps.check.outputs.disk_level == 'ok' && (steps.before.outputs.was_disk_warn == 'true' || steps.before.outputs.was_disk_critical == 'true') }}
        env:
          DETAIL: ${{ steps.check.outputs.disk_detail }}
        run: |
          . "${{ steps.notify.outputs.script }}"
          notify "Coreto: disco normalizou" "O disco da VPS voltou ao normal: $DETAIL." default "white_check_mark"

      # Vermelho só na primeira vez que cai: o e-mail do GitHub avisa uma vez, e não a cada 10 minutos.
      - name: Falhar (primeira queda)
        if: ${{ !inputs.teste && steps.check.outputs.up == 'false' && steps.before.outputs.was_down != 'true' }}
        env:
          DETAIL: ${{ steps.check.outputs.detail }}
        run: |
          echo "::error title=Coreto fora do ar::O servidor nao responde: $DETAIL"
          exit 1

      # Como na queda: a execução fica vermelha na primeira vez que o disco enche, e o GitHub manda e-mail.
      - name: Falhar (disco enchendo)
        if: ${{ !inputs.teste && (steps.disk_warn.outputs.alerted == 'true' || steps.disk_critical.outputs.alerted == 'true') }}
        env:
          DETAIL: ${{ steps.check.outputs.disk_detail }}
        run: |
          echo "::error title=Disco do Coreto enchendo::O disco da VPS esta com $DETAIL"
          exit 1
