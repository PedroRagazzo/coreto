name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coreto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # O nome precisa terminar em _test: os testes apagam o banco (ver server/test/support/database.ts).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coreto_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build do client
        run: npm run build
