name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coreto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # O nome precisa terminar em _test: os testes apagam o banco (ver server/test/support/database.ts).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coreto_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build do client
        run: npm run build

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coreto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Construir a imagem
        run: docker build -t coreto:ci .

      # Sobe como no Dokploy: aplica as migrations num banco vazio e entrega site e API.
      - name: Subir o container e conferir site, API e anexos
        run: |
          docker run -d --name coreto --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/coreto \
            coreto:ci
          for i in $(seq 1 60); do
            curl -fs http://localhost:3000/health && break
            sleep 2
          done
          curl -fs http://localhost:3000/health
          curl -fs http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsI http://localhost:3000/ | grep -qi 'content-security-policy'
          curl -fs -X POST http://localhost:3000/login -H 'content-type: application/json' \
            -d '{"name":"CI","pin":"1234"}' | grep -q '"ok":true'

      # O mesmo comando que o Dokploy agenda: gera a cópia e confere que ela pode ser restaurada.
      - name: Backup do banco
        run: |
          docker exec coreto npm run backup -w server
          docker exec coreto sh -c 'pg_restore --list /data/backups/coreto-*.dump | grep -q "TABLE public Message"'

      # O TURN do deploy (deploy/coturn): sobe pelo mesmo compose e responde STUN e TURN com autenticação.
      - name: TURN (coturn)
        run: |
          TURN_EXTERNAL_IP=127.0.0.1 docker compose -f deploy/coturn/docker-compose.yml up -d
          for i in $(seq 1 15); do node deploy/coturn/check.mjs 127.0.0.1 3490 && exit 0; sleep 2; done
          docker compose -f deploy/coturn/docker-compose.yml logs
          exit 1

      - name: Logs do container
        if: always()
        run: docker logs coreto
