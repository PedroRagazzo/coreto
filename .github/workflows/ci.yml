name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coreto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # O nome precisa terminar em _test: os testes apagam o banco (ver server/test/support/database.ts).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coreto_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build do client
        run: npm run build

  site:
    name: Testes do site (navegador)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coreto_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # O nome precisa terminar em _test: os testes apagam o banco (ver e2e/start-server.ts).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coreto_e2e_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      # Compila o site e roda as jornadas num navegador de verdade contra o servidor real (README, "Testes do site").
      - name: Testes do site
        run: npm run e2e

      - name: Relatório dos testes (só se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-do-site
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coreto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Construir a imagem
        run: docker build -t coreto:ci .

      # Sobe como no Dokploy: aplica as migrations num banco vazio e entrega site e API.
      - name: Subir o container e conferir site, API e anexos
        run: |
          docker run -d --name coreto --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/coreto \
            coreto:ci
          for i in $(seq 1 60); do
            curl -fs http://localhost:3000/health && break
            sleep 2
          done
          curl -fs http://localhost:3000/health
          curl -fs http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsI http://localhost:3000/ | grep -qi 'content-security-policy'
          curl -fs -X POST http://localhost:3000/login -H 'content-type: application/json' \
            -d '{"name":"CI","pin":"1234"}' | grep -q '"ok":true'

      # O bot de música precisa do yt-dlp, do ffmpeg e do WebRTC nativo na imagem de produção.
      - name: Bot de música (yt-dlp, ffmpeg e WebRTC)
        run: |
          docker exec coreto yt-dlp --version
          docker exec coreto ffmpeg -version | head -1
          docker logs coreto 2>&1 | grep -q "bot de música ligado"

      # O servidor liga o backup diário sozinho; `npm run backup` faz uma rodada na hora. Confere que a cópia sai e
      # pode ser lida pelo pg_restore.
      - name: Backup do banco
        run: |
          docker logs coreto 2>&1 | grep -q "backup automático ligado"
          docker exec coreto npm run backup -w server
          docker exec coreto sh -c 'pg_restore --list "$(ls -1t /data/backups/coreto-*.dump | head -1)" | grep -q "TABLE public Message"'

      # O TURN do deploy (deploy/coturn): sobe pelo mesmo compose e responde STUN e TURN com autenticação.
      - name: TURN (coturn)
        run: |
          TURN_EXTERNAL_IP=127.0.0.1 docker compose -f deploy/coturn/docker-compose.yml up -d
          for i in $(seq 1 15); do node deploy/coturn/check.mjs 127.0.0.1 3490 && exit 0; sleep 2; done
          docker compose -f deploy/coturn/docker-compose.yml logs
          exit 1

      - name: Logs do container
        if: always()
        run: docker logs coreto
